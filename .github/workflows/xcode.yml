name: Xcode Playground

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  playground:

    runs-on: macos-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # MACOS
      # ------------------------------------------------------

      - name: Show macOS
        run: |
          echo "======================================"
          echo " macOS INFORMATION"
          echo "======================================"
          sw_vers

      # ------------------------------------------------------
      # XCODE
      # ------------------------------------------------------

      - name: Show Xcode
        run: |
          echo "======================================"
          echo " XCODE INFORMATION"
          echo "======================================"
          xcodebuild -version

      # ------------------------------------------------------
      # SWIFT
      # ------------------------------------------------------

      - name: Show Swift
        run: |
          echo "======================================"
          echo " SWIFT INFORMATION"
          echo "======================================"
          swift --version

      # ------------------------------------------------------
      # PLAYGROUND
      # ------------------------------------------------------

      - name: Check Playground
        run: |
          echo "======================================"
          echo " PLAYGROUND FILES"
          echo "======================================"

          find MyPlayground.playground \
            -maxdepth 2 \
            -type f \
            -print

      # ------------------------------------------------------
      # DISPLAY SOURCE
      # ------------------------------------------------------

      - name: Show Playground source
        run: |
          echo "======================================"
          echo " CONTENTS.SWIFT"
          echo "======================================"

          cat MyPlayground.playground/Contents.swift

      # ------------------------------------------------------
      # EXECUTE PLAYGROUND
      # ------------------------------------------------------

      - name: Execute Playground
        run: |

          mkdir -p output

          echo "======================================"
          echo " PLAYGROUND OUTPUT"
          echo "======================================"

          swift \
            MyPlayground.playground/Contents.swift \
            2>&1 | tee output/playground-output.txt

      # ------------------------------------------------------
      # SAVE ENVIRONMENT
      # ------------------------------------------------------

      - name: Save environment information
        run: |

          mkdir -p output

          sw_vers \
            > output/macos.txt

          xcodebuild -version \
            > output/xcode.txt

          swift --version \
            > output/swift.txt

      # ------------------------------------------------------
      # COPY PLAYGROUND
      # ------------------------------------------------------

      - name: Copy Playground
        run: |

          cp -R \
            MyPlayground.playground \
            output/MyPlayground.playground

      # ------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------

      - name: Upload Playground artifacts
        uses: actions/upload-artifact@v4

        with:

          name: MyPlayground-macOS

          path: output/
