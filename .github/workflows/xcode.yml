name: macOS Xcode Test

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS
        run: |
          echo "===== macOS ====="
          sw_vers

      - name: Show Xcode
        run: |
          echo "===== Xcode ====="
          xcodebuild -version

      - name: Show Swift
        run: |
          echo "===== Swift ====="
          swift --version

      - name: Verify repository
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Files ====="
          find . -maxdepth 3 -type f | sort

      - name: Verify Package.swift
        run: |
          echo "===== Package.swift ====="

          if [ -f Package.swift ]; then
            cat Package.swift
          else
            echo "Package.swift not found"
          fi

      - name: Build Swift source directly
        run: |
          mkdir -p build

          swiftc \
            Sources/MyApp/MyApp.swift \
            -o build/MyApp

      - name: Run Swift program
        run: |
          ./build/MyApp || true

      - name: Create artifacts
        run: |
          mkdir -p artifacts

          sw_vers > artifacts/macos.txt

          xcodebuild -version > artifacts/xcode.txt

          swift --version > artifacts/swift.txt

          cp Sources/MyApp/MyApp.swift artifacts/MyApp.swift

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcode-test
          path: artifacts/