name: macOS Xcode Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Git information
        run: |
          echo "===== GITHUB SHA ====="
          echo "$GITHUB_SHA"

          echo "===== GITHUB REF ====="
          echo "$GITHUB_REF"

          echo "===== GIT COMMIT ====="
          git log -1 --oneline

      - name: Verify Package.swift
        run: |
          echo "===== Package.swift ====="
          pwd
          ls -la
          echo ""
          cat Package.swift
          echo ""
          echo "===== FIRST LINE ====="
          head -n 1 Package.swift

      - name: Verify Swift tools version
        run: |
          grep "swift-tools-version" Package.swift

      - name: Show macOS version
        run: |
          sw_vers

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Show Swift version
        run: |
          swift --version

      - name: Resolve dependencies
        run: |
          swift package resolve

      - name: Build Swift project
        run: |
          swift build -c release

      - name: Run tests
        run: |
          swift test

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts

          sw_vers > artifacts/macos.txt

          xcodebuild -version > artifacts/xcode.txt

          swift --version > artifacts/swift.txt

          cp Package.swift artifacts/Package.swift

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcode-build
          path: artifacts/